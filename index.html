<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Simple Budget & Expense Tracker</p>
    </header>

    <main>

        <!-- Budget Section -->
        <section class="card">
            <h2>Set Your Budget</h2>

            <form id="budgetForm">
                <label for="budget">Monthly Budget:</label>
                <input
                    type="number"
                    id="budget"
                    placeholder="Enter your budget"
                    min="0"
                    required
                >

                <button type="submit">Set Budget</button>
            </form>
        </section>

        <!-- Add Expense Section -->
        <section class="card">
            <h2>Add Expense</h2>

            <form id="expenseForm">

                <label for="expenseName">Expense Name:</label>
                <input
                    type="text"
                    id="expenseName"
                    placeholder="e.g. Food"
                    required
                >

                <label for="expenseAmount">Amount:</label>
                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Enter amount"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <!-- Dashboard -->
        <section class="card dashboard">
            <h2>Dashboard</h2>

            <div class="summary">
                <div>
                    <h3>Budget</h3>
                    <p id="budgetDisplay">KES 0.00</p>
                </div>

                <div>
                    <h3>Total Expenses</h3>
                    <p id="expenseDisplay">KES 0.00</p>
                </div>

                <div>
                    <h3>Remaining</h3>
                    <p id="remainingDisplay">KES 0.00</p>
                </div>
            </div>

            <div id="budgetMessage" class="message">
                Set your budget to begin.
            </div>
        </section>

        <!-- Expense Records -->
        <section class="card">
            <h2>Expense Records</h2>

            <ul id="expenseList">
                <li>No expenses added yet.</li>
            </ul>

            <button id="clearButton" class="danger">
                Clear All Expenses
            </button>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 SpendWise</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
